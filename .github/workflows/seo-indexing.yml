name: SEO indexing

# Generated by `site-seo-kit init`. Sends the URLs of the live sitemap to the
# search engines so new and changed pages are crawled sooner.
#
#   Google: needs the GOOGLE_INDEXING_CREDENTIALS secret (`npx site-seo-kit secret`).
#   IndexNow: needs <key>.txt live on the site (`site-seo-kit generate` writes it).
#
# The weekly run sends only URLs whose <lastmod> moved in the last 8 days; a
# manual run sends everything unless "since" is filled in.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Only URLs modified since (7d, 24h, 2026-01-31). Empty = all."
        required: false
        default: ""
      type:
        description: "Google notification type"
        type: choice
        default: URL_UPDATED
        options:
          - URL_UPDATED
          - URL_DELETED

permissions:
  contents: read

concurrency:
  group: seo-indexing
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      SINCE: ${{ github.event_name == 'schedule' && '8d' || inputs.since }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        # npm install, like the other workflows: the committed lockfile is not kept in sync (the pre-commit hook unstages it)
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Google Indexing API
        env:
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          TYPE: ${{ inputs.type || 'URL_UPDATED' }}
        run: |
          if [ -z "$GOOGLE_INDEXING_CREDENTIALS" ]; then
            echo "::error title=Missing secret::GOOGLE_INDEXING_CREDENTIALS is not set. Run: npx site-seo-kit secret"
            exit 1
          fi
          npx site-seo-kit submit --type "$TYPE" ${SINCE:+--since "$SINCE"}

      - name: IndexNow
        if: ${{ !cancelled() }}
        run: npx site-seo-kit indexnow ${SINCE:+--since "$SINCE"}
